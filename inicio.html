<!DOCTYPE html>

<div class="fondo">

<!-- Curva decorativa al final del header -->

      <defs>

          <stop stop-color="#ffeede" offset="0%"></stop>

        </linearGradient>

      <path fill="url(#gradient)" d="M 0 50 Q 250 100 500 50 T 1000 50 L 1000 100 L 0 100 Z"></path>

    <div style="width: 100%; min-height: 700px; background-color: #ffeede;">
